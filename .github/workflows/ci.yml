name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: |
          bun run format
          git diff --exit-code || (echo "::error::Run 'bun run format' locally and commit the result." && exit 1)

      - name: Test
        run: bun run test
        env:
          # Allow the integration smoke test to reach livetv.sx
          LIVETV_BASE_URL: https://livetv.sx
